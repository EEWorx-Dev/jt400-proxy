name: Publish @eeworx-dev/jt400-proxy-client

on:
  workflow_dispatch:
    inputs:
      version:
        description: ''
        required: false
        default: ''

  # Uncomment the lines below when you're ready to publish automatically on releases
  # release:
  #   types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          # This configures npm to publish to GitHub Packages
          # 'lts/*' automatically uses the current Long Term Support version (currently 24)

      - name: Install dependencies & run tests
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Publish to GitHub Packages
        working-directory: client
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            npm version ${{ github.event.inputs.version }} --no-git-tag-version
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is automatically provided by GitHub Actions
          # and has permission to publish packages when "packages: write" is granted.

      - name: Print published package info
        run: |
          echo "Package published successfully!"
          echo "View it at: https://github.com/eeworx-dev?tab=packages"
