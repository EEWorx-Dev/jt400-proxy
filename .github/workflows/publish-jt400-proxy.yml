name: Publish @eeworx-dev/jt400-proxy (client + server)
# Single workflow file with multiple jobs: one for the Node/npm client package,
# one for the Java/Maven server package.
#
# Triggers:
# - workflow_dispatch: manual runs (client only; server job is skipped)
# - release (created/published/released): both client + server deploy
#
# The deploy-server job is intentionally skipped for manual dispatches because it
# checks out a specific release tag (github.event.release.tag_name) and is meant
# for official releases.
#
# A debug step (in the 'publish' job) always prints github.event_name so you can
# see why deploy-server was skipped (e.g. "release=false" in the UI means the
# triggering event was not a release event).
#
# Uses direct `npm publish` for client and `mvn deploy` (on tag) for server,
# per root pom guidance (maven-release-plugin is configured for verify only).

on:
  workflow_dispatch:
    # Version is managed manually in client/package.json (or via a separate versioning step).
    # To re-enable the version input, add it back under inputs.

  release:
    types: [created, published, released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug trigger event (always runs)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.action=${{ github.event.action || 'n/a' }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "github.actor=${{ github.actor }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "This is a RELEASE event"
            echo "Release tag: ${{ github.event.release.tag_name || 'n/a' }}"
          else
            echo "This is NOT a release event (likely workflow_dispatch or other)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies & run tests
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Debug auth and registry (safe)
        working-directory: client
        run: |
          npm config list --json | grep -E 'registry|//npm.pkg.github.com' || true
          echo "Authenticated as (redacted for log):"
          npm whoami --registry=https://npm.pkg.github.com 2>&1 | cat || echo "whoami failed (expected if no read permission yet)"

      - name: Set current date environment variable
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Check if package version already published
        id: check_version
        working-directory: client
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "package_name=$NAME" >> $GITHUB_OUTPUT
          echo "package_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Checking for existing package: $NAME@$VERSION"
          # Configure npm auth for the registry so `npm view` can access GitHub Packages
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          if npm --silent view "$NAME@$VERSION" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to GitHub Packages."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found in GitHub Packages — ok to publish."
          fi

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.published == 'false'
        working-directory: client
        run: |
          # Ensure npm uses the token for the GitHub Packages registry
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          npm publish --verbose --tag "release-$CURRENT_DATE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print published package info
        run: |
          if [ "${{ steps.check_version.outputs.published }}" = "true" ]; then
            echo "Skipped publish because package version already exists."
          else
            echo "Client package publish step completed."
          fi
          echo "View packages at: https://github.com/eeworx-dev?tab=packages"

  deploy-server:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Debug release event (deploy-server)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "Release tag from context: ${{ github.event.release.tag_name }}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy server artifact to GitHub Packages
        run: mvn -B deploy -DskipTests -pl :jt400-proxy-server -am
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
