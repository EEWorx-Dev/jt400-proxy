name: Publish @eeworx-dev/jt400-proxy (client + server)
# Single workflow file with multiple jobs: one for the Node/npm client package,
# one for the Java/Maven artifacts (parent, server, client, dist).
#
# Triggers:
# - workflow_dispatch (manual from Actions tab):
#     - Always runs the client (npm) publish job for whatever is on the branch.
#     - Runs mvn-deploy only if you set include_server=true and provide a server_tag
#       (the tag must exist and contain the release versions in the POMs + client/package.json).
# - release (created/published/released via GitHub Releases UI or gh release): both jobs run
#   automatically using the release's tag for context.
#
# The mvn-deploy job requires a concrete tag/ref (either from the release event or your input)
# because it does `checkout` + `mvn deploy` (full reactor) against the exact released versions.
# This deploys parent, server, client (Maven), and dist artifacts.
#
# Both the client publish and Maven deploy steps are guarded with "already exists"
# checks (npm view for client, HEAD of the published .jar for server via GH Packages).
# This makes re-running the workflow for an existing release a no-op instead of failing
# on duplicate artifact/version errors.
#
# A debug step (in the 'publish' job) always prints github.event_name so you can
# see why mvn-deploy was skipped (e.g. "release=false" in the UI means the
# triggering event was not a release event).
#
# Uses direct `npm publish` for client and `mvn deploy` (on tag, full reactor) for Maven artifacts,
# per root pom guidance (maven-release-plugin is configured for verify only).

on:
  workflow_dispatch:
    inputs:
      # Version is managed manually in client/package.json (or via a separate versioning step).
      # To re-enable the version input, add it back under inputs.

      include_server:
        description: 'Also run the mvn-deploy job (full Maven reactor: parent, server, client, dist). You must provide a server_tag that points to a commit with the final (non-SNAPSHOT) versions in the poms.'
        required: false
        default: false
        type: boolean

      server_tag:
        description: 'Git tag/ref to checkout for the mvn-deploy job (e.g. 0.1.0 or v0.1.0). Only used when include_server=true. On real release events this is taken from the release context automatically.'
        required: false
        type: string

  release:
    types: [created, published, released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug trigger event (always runs)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.action=${{ github.event.action || 'n/a' }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "github.actor=${{ github.actor }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "This is a RELEASE event"
            echo "Release tag: ${{ github.event.release.tag_name || 'n/a' }}"
          else
            echo "This is NOT a release event (likely workflow_dispatch or other)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies & run tests
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Debug auth and registry (safe)
        working-directory: client
        run: |
          npm config list --json | grep -E 'registry|//npm.pkg.github.com' || true
          echo "Authenticated as (redacted for log):"
          npm whoami --registry=https://npm.pkg.github.com 2>&1 | cat || echo "whoami failed (expected if no read permission yet)"

      - name: Set current date environment variable
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Check if package version already published
        id: check_version
        working-directory: client
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "package_name=$NAME" >> $GITHUB_OUTPUT
          echo "package_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Checking for existing package: $NAME@$VERSION"
          # Configure npm auth for the registry so `npm view` can access GitHub Packages
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          if npm --silent view "$NAME@$VERSION" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to GitHub Packages."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found in GitHub Packages — ok to publish."
          fi

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.published == 'false'
        working-directory: client
        run: |
          # Ensure npm uses the token for the GitHub Packages registry
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          npm publish --verbose --tag "release-$CURRENT_DATE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print published package info
        run: |
          if [ "${{ steps.check_version.outputs.published }}" = "true" ]; then
            echo "Skipped publish because package version already exists."
          else
            echo "Client package publish step completed."
          fi
          echo "View packages at: https://github.com/eeworx-dev?tab=packages"

  mvn-deploy:
    # Deploy Maven artifacts for the full reactor (parent, server, client, dist).
    # - Real release events: automatic (tag from github.event.release.*)
    # - Manual workflow_dispatch: only when include_server=true + server_tag provided.
    # The job still requires a concrete checkout ref because it runs
    # `mvn deploy` (full reactor, no -pl) against the exact released versions from the tag.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.include_server == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Debug release event (mvn-deploy)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "Release tag from context: ${{ github.event.release.tag_name }}"
          echo "include_server input: ${{ github.event.inputs.include_server }}"
          echo "server_tag input: ${{ github.event.inputs.server_tag }}"

      - name: Validate manual mvn deploy inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.include_server }}" != "true" ]; then
            echo "This should not have run (include_server was not true)"
            exit 1
          fi
          if [ -z "${{ github.event.inputs.server_tag }}" ]; then
            echo "::error::server_tag input is required when include_server=true for a manual run"
            exit 1
          fi
          echo "Manual Maven reactor deploy requested for tag: ${{ github.event.inputs.server_tag }}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.server_tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check if artifacts already deployed to GitHub Packages
        id: check_server_deploy
        run: |
          # Resolve the exact release version from the checked-out poms (must match the tag).
          # Server module used as version representative for the full reactor (parent + server + client + dist).
          SERVER_VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout -pl :jt400-proxy-server -am 2>/dev/null || echo "")
          if [ -z "$SERVER_VERSION" ]; then
            echo "Failed to resolve version from POMs"
            exit 1
          fi
          echo "server_version=$SERVER_VERSION" >> $GITHUB_OUTPUT
          GROUP_PATH=dev/eeworx/utils
          ARTIFACT=jt400-proxy-server
          URL="https://maven.pkg.github.com/eeworx-dev/jt400-proxy/${GROUP_PATH}/${ARTIFACT}/${SERVER_VERSION}/${ARTIFACT}-${SERVER_VERSION}.jar"
          echo "Checking for existing artifact at $URL (for full reactor deploy)"
          # Use token for auth (works for both private and public packages)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$URL" || echo "000")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Artifact $SERVER_VERSION already exists — skipping deploy."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Artifact $SERVER_VERSION not present (HTTP $HTTP_STATUS) — will deploy."
          fi
      
      - name: Configure Maven settings for GitHub Packages
        if: steps.check_server_deploy.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy artifacts to GitHub Packages
        if: steps.check_server_deploy.outputs.exists == 'false'
        # Deploys the full Maven reactor (parent, server, client, dist) — no -pl used.
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
