name: Publish @eeworx-dev/jt400-proxy (client + server)
# Single workflow file with multiple jobs: one for the Node/npm client package,
# one for the Java/Maven server package.
#
# Triggers:
# - workflow_dispatch: manual runs (client only; server job is skipped)
# - release (created/published/released): both client + server deploy
#
# The deploy-server job is intentionally skipped for manual dispatches because it
# checks out a specific release tag (github.event.release.tag_name) and is meant
# for official releases.
#
# A debug step (in the 'publish' job) always prints github.event_name so you can
# see why deploy-server was skipped (e.g. "release=false" in the UI means the
# triggering event was not a release event).
#
# Uses direct `npm publish` for client and `mvn deploy` (on tag) for server,
# per root pom guidance (maven-release-plugin is configured for verify only).

on:
  workflow_dispatch:
    # Version is managed manually in client/package.json (or via a separate versioning step).
    # To re-enable the version input, add it back under inputs.

  release:
    # Use published (and created/released) because the GitHub Releases UI "Publish release"
    # typically fires the "published" action, not just "created". This ensures the
    # deploy-server job (and client publish on release) actually run when you cut a release.
    types: [created, published, released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 runtime for GitHub Actions (checkout, setup-node, etc.)
      # This addresses the deprecation of Node 20 on GitHub-hosted runners.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug trigger event (always runs)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.action=${{ github.event.action || 'n/a' }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "github.actor=${{ github.actor }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "This is a RELEASE event"
            echo "Release tag: ${{ github.event.release.tag_name || 'n/a' }}"
            echo "Release name: ${{ github.event.release.name || 'n/a' }}"
            echo "Release draft: ${{ github.event.release.draft || 'n/a' }}"
            echo "Release prerelease: ${{ github.event.release.prerelease || 'n/a' }}"
          else
            echo "This is NOT a release event (likely workflow_dispatch or other)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          # Use the same major version as your production runtime (Node 24 is current LTS)

      - name: Install dependencies & run tests
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Debug auth and registry (safe)
        working-directory: client
        run: |
          npm config list --json | grep -E 'registry|//npm.pkg.github.com' || true
          echo "Authenticated as (redacted for log):"
          npm whoami --registry=https://npm.pkg.github.com 2>&1 | cat || echo "whoami failed (expected if no read permission yet)"

      - name: Set current date environment variable
        run: echo "CURRENT_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        working-directory: client
        run: |
          # if [ -n "${{ github.event.inputs.version }}" ]; then
          #   npm version ${{ github.event.inputs.version }} --no-git-tag-version
          # fi
          npm publish --verbose --tag "release-$CURRENT_DATE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is automatically provided by GitHub Actions
          # and has permission to publish packages when "packages: write" is granted.

      - name: Print published package info
        run: |
          echo "Client package publish step completed (for workflow_dispatch or release)."
          echo "View packages at: https://github.com/eeworx-dev?tab=packages"

  deploy-server:
    # Deploy the Maven (Java server) artifact on releases.
    # This workflow file contains jobs for both the npm client and the Maven server
    # (per the agreed multi-job approach in a single file).
    #
    # Note: we gate on the release *event* (not just a tag push) because this job
    # relies on github.event.release.* context (e.g. tag_name) and we only want
    # to deploy the server when an official release is published.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Debug release event (deploy-server)
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.event.action=${{ github.event.action }}"
          echo "Release tag from context: ${{ github.event.release.tag_name }}"
          echo "Release id: ${{ github.event.release.id }}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy server artifact to GitHub Packages
        # -am builds dependencies if any; -pl limits to the server module
        run: mvn -B deploy -DskipTests -pl :jt400-proxy-server -am
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
