# This workflow will build and release a package using Maven and the maven-release-plugin
# It is manually triggered via workflow_dispatch

name: Publish JT400 Proxy Server
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      developmentVersion:
        description: 'Development version (e.g., 0.1.1-SNAPSHOT)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Configure Git User
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Run Maven Release Prepare (creates tag and commits)
      working-directory: server
      run: |
        mvn -B release:prepare \
          -DreleaseVersion=${{ github.event.inputs.releaseVersion }} \
          -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }} \
          -Dusername=${{ github.actor }} \
          -Dpassword=${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Maven Release Perform (builds and publishes)
      working-directory: server
      run: |
        mvn -B release:perform \
          -Dusername=${{ github.actor }} \
          -Dpassword=${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
